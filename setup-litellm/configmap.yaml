apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # LiteLLM Model Configuration
      # Add your models here. Each model needs a name and configuration.
      # For Azure models, use environment variables for API keys (e.g., os.environ/AZURE_GPT_4O_API_KEY)

      # Example: Local vLLM model (already running in the cluster)
      - model_name: deepseek
        litellm_params:
          model: openai/deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
          api_base: "http://vllm-service.vllm-inference.svc.cluster.local:8000/v1"
          api_key: os.environ/DUMMY_API_KEY
          num_retries: 3

      # Example: Azure OpenAI Models

      - model_name: gpt-4o
        litellm_params:
          model: azure/gpt-4o
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2025-01-01-preview"
          api_key: os.environ/AZURE_GPT_4O_API_KEY

      - model_name: gpt-4.1
        litellm_params:
          model: azure/gpt-4.1
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2025-01-01-preview"
          api_key: os.environ/AZURE_GPT_41_API_KEY

      - model_name: gpt-4o-mini
        litellm_params:
          model: azure/gpt-4o-mini
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2025-01-01-preview"
          api_key: os.environ/AZURE_GPT_4O_MINI_API_KEY

      - model_name: text-embedding-3-large
        litellm_params:
          model: azure/text-embedding-3-large
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2023-05-15"
          api_key: os.environ/AZURE_TEXT_EMBEDDING_3_LARGE_API_KEY

      - model_name: text-embedding-3-small
        litellm_params:
          model: azure/text-embedding-3-small
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2023-05-15"
          api_key: os.environ/AZURE_TEXT_EMBEDDING_3_SMALL_API_KEY

      - model_name: whisper
        litellm_params:
          model: azure/whisper
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2024-06-01"
          api_key: os.environ/AZURE_WHISPER_API_KEY

      - model_name: gpt-4o-mini-transcribe
        litellm_params:
          model: azure/gpt-4o-mini-transcribe
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2025-03-01-preview"
          api_key: os.environ/AZURE_GPT_4O_MINI_TRANSCRIBE_API_KEY

      - model_name: gpt-4o-transcribe
        litellm_params:
          model: azure/gpt-4o-transcribe
          api_base: https://openai-q2ifd2wgmoexo.openai.azure.com
          api_version: "2025-03-01-preview"
          api_key: os.environ/AZURE_GPT_4O_TRANSCRIBE_API_KEY

      - model_name: gpt-image-1
        litellm_params:
          model: azure/gpt-image-1
          api_base: https://openai-itdd.openai.azure.com/
          api_version: "2025-04-01-preview"
          api_key: os.environ/AZURE_GPT_IMAGE_1_API_KEY

      - model_name: dall-e-3
        litellm_params:
          model: azure/dall-e-3
          api_base: https://aulia-m3odnaiy-eastus.cognitiveservices.azure.com
          api_version: "2024-02-01"
          api_key: os.environ/AZURE_DALL_E_3_API_KEY

      # Example: Azure AI Models

      - model_name: Llama-3-2-90B-Vision-GAR
        litellm_params:
          model: azure_ai/Llama-3.2-90B-Vision-Instruct
          api_base: https://Llama-3-2-90B-Vision-GAR.southcentralus.models.ai.azure.com
          api_key: os.environ/AZURE_AI_LLAMA_3_2_90B_VISION_API_KEY

      - model_name: DeepSeek-R1-GAR
        litellm_params:
          model: azure_ai/deepseek-r1
          api_base: https://DeepSeek-R1-GAR.southcentralus.models.ai.azure.com
          api_key: os.environ/AZURE_AI_DEEPSEEK_R1_API_KEY

      - model_name: MAI-DS-R1
        litellm_params:
          model: azure_ai/MAI-DS-R1
          api_base: https://MAI-DS-R1.southcentralus.models.ai.azure.com
          api_key: os.environ/AZURE_AI_MAI_DS_R1_API_KEY

      - model_name: DeepSeek-V3-0324-GAR
        litellm_params:
          model: azure_ai/deepseek-v3-0324
          api_base: https://DeepSeek-V3-0324-GAR.southcentralus.models.ai.azure.com
          api_key: os.environ/AZURE_AI_DEEPSEEK_V3_0324_API_KEY

      - model_name: Phi-4-multimodal-instruct
        litellm_params:
          model: azure_ai/Phi-4-multimodal-instruct
          api_base: https://Phi-4-multimodal-instruct.southcentralus.models.ai.azure.com
          api_key: os.environ/AZURE_AI_PHI_4_MULTIMODAL_API_KEY
          max_tokens: 4096
          temperature: 0.1


    litellm_settings:
      success_callback: ["redis"]
      cache: true
      cache_params:
        type: "redis"
        host: "master.automode-cluster-litellm-redis.tdph7g.apse3.cache.amazonaws.com"
        port: 6379
        password: "hvhiMCv91VcTgDDJwT"
        ssl: true
        ssl_certfile: null
        ssl_keyfile: null
        ssl_ca_certs: null

    general_settings:
      # master_key and database_url will be set via environment variables
      disable_spend_logs: false
      disable_usage_tracking: false
      disable_telemetry: true
      routing_strategy: "simple-shuffle"
      num_retries: 3
      allowed_origins: ["*"]
